[project]
name = "sec-rubrics"
version = "0.1.0"
description = "SEC EDGAR rubrics environment with rubric-based evaluation"
requires-python = ">=3.11"
dependencies = [
    "hud-python@git+https://github.com/hud-evals/hud-python@v5",
    "httpx>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hud]
image = "sec-rubrics:dev"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["server", "environment"]
