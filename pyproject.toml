[project]
name = "sec-rubrics"
version = "0.1.0"
description = "SEC EDGAR rubrics environment with rubric-based evaluation"
requires-python = ">=3.11"
dependencies = [
    "hud-python>=0.4.54",
    "httpx>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hud]
image = "sec-rubrics:dev"

[tool.hatch.metadata]
allow-direct-references = true
